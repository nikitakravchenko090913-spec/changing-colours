<!DOCTYPE html>
<html>
    <head>
        <title>Change Colours</title>

         <style>
    body {
      background-color: lightblue;
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 100px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
    }
    
    </style>
    </head>
    <body>
        <h2>Changing colours in JavaScript</h2>

        <button id="colourButton">Change Colour</button>

        <script>
            
const button = document.getElementById("colourButton");

button.addEventListener("click", function() {
    const colours = [
        "red",
        "blue",
        "green",
        "purple",
        "orange",
        "pink"
    ];

    const randomIndex = Math.floor(
        Math.random() * colours.length
    );

    document.body.style.backgroundColor = colours[randomIndex];
});


        </script>
    </body>
</html>
